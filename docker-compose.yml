services:
  skillgoblin:
    image: node:24-slim
    working_dir: /app
    volumes:
      - ./:/app
      - ./data/database:/app/data/database
      - ./data/content:/courses/main:ro
    command: sh -c "cd frontend && npm install && npm run dev"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - ADMIN_NAME=${ADMIN_NAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - CONTENT_DIRS=main=/courses/main
      - CHOKIDAR_POLLING_INTERVAL=60000 # Default polling interval in ms (60 seconds)
    ports:
      - "3006:3000"
    restart: unless-stopped
